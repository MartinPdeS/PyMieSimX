name: Deploy GUI coverage

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    name: Run GUI tests and publish coverage
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@v7
        with:
          python-version: "3.11"
          install-command: >-
            python -m pip install --upgrade pip wheel build && python -m pip install -e ".[testing]"
          fetch-depth: 0

      - name: Initialize material catalog
        run: python -m PyOptik setup --no-progress

      - name: Run GUI tests with coverage
        run: |
          coverage erase
          python -m pytest \
            --import-mode=importlib \
            --cov=PyMieSimX \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            tests/gui \
            --config-file=pytest.ini

      - name: Post coverage comment
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: .
