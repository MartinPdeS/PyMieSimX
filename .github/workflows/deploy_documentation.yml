# Build and publish the versioned documentation site.
name: Documentation

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: documentation-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  documentation:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      python-version: "3.13"
      package-name: "PyMieSimX"
      deploy-pages: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
