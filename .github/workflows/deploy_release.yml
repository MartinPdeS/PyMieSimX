name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    uses: MartinPdeS/MPSActions/.github/workflows/publish_pure_package_to_PyPi.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      python-version: "3.11"
      test-command: python -c "import PyMieSimX"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  conda:
    name: Publish Conda package
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@a01969bc5af90666281f9d37acffdf6a4629763a
    with:
      python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: pymiesimx
      recipe_path: conda.recipe
      test_import: PyMieSimX
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
