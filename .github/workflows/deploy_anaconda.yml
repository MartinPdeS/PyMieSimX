name: Publish Conda package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@v5
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: pymiesimx
      recipe_path: conda.recipe
      test_import: PyMieSimX
      # Shell startup in the reusable workflow reactivates base, even through
      # conda run. Invoke the installed environment's interpreter directly.
      test_command: >-
        if [ -f '${test_prefix}/python.exe' ]; then
        '${test_prefix}/python.exe' '${GITHUB_WORKSPACE}/tools/verify_conda_artifact.py';
        else
        '${test_prefix}/bin/python' '${GITHUB_WORKSPACE}/tools/verify_conda_artifact.py';
        fi
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
