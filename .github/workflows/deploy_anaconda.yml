name: Publish Conda package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@v5
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: pymiesimx
      recipe_path: conda.recipe
      test_import: PyMieSimX
      # The reusable workflow launches bash inside conda run; shell startup
      # can reactivate base. Target its clean test prefix for both checks.
      test_command: >-
        conda run -p '${test_prefix}' python -c 'import PyMieSimX' &&
        conda run -p '${test_prefix}' pymiesimx --help
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
