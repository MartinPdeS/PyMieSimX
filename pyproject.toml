[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMieSimX"
version = "0.1.0"
description = "Graphical Dash interface for PyMieSim."
license = { file = "LICENSE" }
readme = "README.rst"
requires-python = ">=3.10"
authors = [
    { name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" }
]
dependencies = [
    "PyMieSim>=5.1.2",
    "dash>=4.1.0",
    "gunicorn>=23.0.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24,<7",
]

[project.urls]
Repository = "https://github.com/MartinPdeS/PyMieSimX"

[project.scripts]
pymiesimx = "PyMieSimX.__main__:main"

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
]
dev = [
    "build>=1.2",
    "mypy==2.3.0",
    "ruff==0.11.2",
]

[tool.setuptools.packages.find]
include = ["PyMieSimX*"]

[tool.setuptools.package-data]
"PyMieSimX.gui" = ["assets/*"]
