[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMieSimX"
dynamic = ["version"]
description = "Graphical Dash interface for PyMieSim."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
authors = [
    { name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" }
]
dependencies = [
    "PyMieSim>=5.1.2,<6",
    "dash>=4.1.0,<5",
    "gunicorn>=23.0.0,<27",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "psycopg[binary]>=3.2.9,<4",
]

[project.urls]
Repository = "https://github.com/MartinPdeS/PyMieSimX"

[project.scripts]
pymiesimx = "PyMieSimX.__main__:main"

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
]
dev = [
    "build>=1.2",
    "mypy==1.15.0",
    "ruff==0.11.2",
]

[tool.setuptools.packages.find]
include = ["PyMieSimX*"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.setuptools.package-data]
"PyMieSimX.gui" = ["assets/*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
exclude = "(^development/|^docs/)"
