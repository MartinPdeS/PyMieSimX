[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PyMieSimX"
version = "0.4.6"
description = "Graphical Dash interface for PyMieSim."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.11"
authors = [
    { name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" }
]
dependencies = [
    "PyMieSim>=5.7.1,<6",
    "PyOptik>=3.2.1,<4",
    "dash>=4.1.0,<5",
    "gunicorn>=23.0.0,<24",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pint>=0.24,<0.26",
    "plotly>=5.24,<7",
    "psycopg[binary]>=3.2.9,<4",
]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/MartinPdeS/PyMieSimX"

[project.scripts]
pymiesimx = "PyMieSimX.__main__:main"

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
]
browser = [
    "dash[testing]>=4.1,<5",
]
dev = [
    "build>=1.2",
    "mypy==1.15.0",
    "ruff==0.11.2",
]
docs = [
    "MartinPdeS-docs>=0.4.0,<0.5",
]
documentation = [
    "MartinPdeS-docs>=0.4.0,<0.5",
]

[tool.setuptools.packages.find]
include = ["PyMieSimX*"]

[tool.setuptools.package-data]
"PyMieSimX.gui" = ["assets/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = "(^development/|^docs/)"

[tool.mps-maintenance]
version-file = "PyMieSimX/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
