[pytest]
minversion = 8.0
xfail_strict = true
log_cli_level = INFO
addopts =
    -vv
    -rA
    --cov=PyMieSimX
    --cov-report=term
    --cov-report=html
    --cov-config=.coveragerc
    --capture=tee-sys
    --import-mode=importlib
testpaths =
    tests/gui
python_files = *.py
python_functions = test_*
