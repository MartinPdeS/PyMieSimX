services:
  pymiesimx:
    build: .
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${PYMIESIMX_PORT:-8050}:8050"
    environment:
      PYMIESIMX_ADMIN_TOKEN: "${PYMIESIMX_ADMIN_TOKEN:-}"
      PYMIESIMX_IPINFO_TOKEN: "${PYMIESIMX_IPINFO_TOKEN:-}"
      PYMIESIMX_TRUSTED_PROXY_COUNT: "${PYMIESIMX_TRUSTED_PROXY_COUNT:-0}"
